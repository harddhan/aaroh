<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Archival Royal Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1D38" />
      <stop offset="60%" stop-color="#102E56" />
      <stop offset="100%" stop-color="#061426" />
    </linearGradient>

    <!-- Constitutional Illuminated Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE6A4" />
      <stop offset="40%" stop-color="#D9A844" />
      <stop offset="85%" stop-color="#B28028" />
      <stop offset="100%" stop-color="#8C5F18" />
    </linearGradient>

    <!-- Rich Navy Core Gradient -->
    <linearGradient id="navyCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164373" />
      <stop offset="100%" stop-color="#0D2C4D" />
    </linearGradient>

    <!-- Subtle Radial Glow behind the Diamond -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9A844" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A1D38" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Archival Navy Tile with Rounded Corners (High contrast on dark & light browser tabs) -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  
  <!-- Subtle Illuminated Gold Frame Accent -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.65" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#centerGlow)" />

  <!-- ── AAROH ICONIC ROTATED SQUARE (DIAMOND) EMBLEM ── -->
  <!-- Outer Gold Diamond Accent (Rotated Square 32x32 at 45°) -->
  <rect x="16" y="16" width="32" height="32" rx="3.5" transform="rotate(45 32 32)" fill="url(#goldGrad)" />

  <!-- Inset Royal Navy Diamond Core -->
  <rect x="18.5" y="18.5" width="27" height="27" rx="2" transform="rotate(45 32 32)" fill="url(#navyCore)" />

  <!-- Inner Gold Precision Border Line -->
  <rect x="21" y="21" width="22" height="22" rx="1.5" transform="rotate(45 32 32)" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.75" />

  <!-- Inner Luminous Gold Diamond Jewel -->
  <rect x="25.5" y="25.5" width="13" height="13" rx="1.5" transform="rotate(45 32 32)" fill="url(#goldGrad)" />

  <!-- Center Archival Navy Focal Point -->
  <rect x="29.5" y="29.5" width="5" height="5" rx="0.5" transform="rotate(45 32 32)" fill="#0A1D38" />
</svg>
